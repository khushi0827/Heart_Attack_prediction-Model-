<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Heart Attack Predictor</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background-color: #000;
      color: #39ff14; /* neon green */
      font-family: Arial, sans-serif;
      text-align: center;
    }
    h1 {
      color: #ff073a; /* neon red */
    }
    form {
      margin: 20px auto;
      width: 60%;
      text-align: left;
      padding: 20px;
      border: 2px solid #39ff14;
      border-radius: 10px;
    }
    label {
      display: block;
      margin-top: 10px;
    }
    input, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      background-color: #111;
      color: #39ff14;
      border: 1px solid #ff073a;
      border-radius: 5px;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #ff073a;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #39ff14;
      color: black;
    }
    #result {
      margin-top: 20px;
      font-size: 20px;
    }
    canvas {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>💓 Heart Attack Risk Predictor</h1>
  <form id="heartForm">
    <label>Age: <input type="number" id="age" min="18" max="100"></label>
    <label>Sex: 
      <select id="sex">
        <option value="0">Female</option>
        <option value="1">Male</option>
      </select>
    </label>
    <label>Chest Pain Type (cp): <input type="number" id="cp"></label>
    <label>Resting Blood Pressure (trestbps): <input type="number" id="trestbps"></label>
    <label>Cholesterol (chol): <input type="number" id="chol"></label>
    <label>Fasting Blood Sugar >120 (fbs): <input type="number" id="fbs"></label>
    <label>Resting ECG (restecg): <input type="number" id="restecg"></label>
    <label>Max Heart Rate (thalach): <input type="number" id="thalach"></label>
    <label>Exercise Induced Angina (exang): <input type="number" id="exang"></label>
    <label>ST Depression (oldpeak): <input type="number" step="0.1" id="oldpeak"></label>
    <label>Slope (slope): <input type="number" id="slope"></label>
    <label>Major Vessels (ca): <input type="number" id="ca"></label>
    <label>Thalassemia (thal): <input type="number" id="thal"></label>
    <button type="button" onclick="predict()">Predict</button>
  </form>

  <div id="result"></div>
  <canvas id="pieChart" width="400" height="400"></canvas>

  <script>
    function predict() {
      // Demo: random probability
      let probYes = Math.random();
      let probNo = 1 - probYes;
      let resultText = probYes > 0.5 ? "⚠️ High Risk" : "✅ Low Risk";
      document.getElementById("result").innerText = "Prediction: " + resultText;

      const ctx = document.getElementById('pieChart').getContext('2d');
      if (window.pieChartInstance) {
        window.pieChartInstance.destroy();
      }
      window.pieChartInstance = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: ['Yes (Risk)', 'No (Safe)'],
          datasets: [{
            data: [probYes, probNo],
            backgroundColor: ['#ff073a', '#39ff14']
          }]
        },
        options: {
          plugins: {
            legend: {
              labels: { color: '#39ff14' }
            }
          }
        }
      });
    }
  </script>
</body>
</html>
